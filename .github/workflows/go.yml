name: Verify trade demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.9"
          cache: false
      - run: go mod download
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run format:check && npm run lint && npm test && npm run build
        working-directory: implementations/go/web
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./cmd/... ./internal/...
      - run: ./demo
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: docker compose --profile test run --build --rm tests
      - run: python3 scripts/smoke.py
      - name: Container security scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: abyss-trade-mnt-api
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop services
        if: always()
        run: docker compose down
