server {
    listen 80;
    root /usr/share/nginx/html;

    # The browser uses a same-origin route. This is the internal Docker address.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri /index.html;
    }
}
