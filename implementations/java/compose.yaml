# Host ports avoid conflicts. Java processes share one image/codebase.
name: abyss-trade-java-events
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
      POSTGRES_DB: trade
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U trade -d trade
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
    - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -c
    command:
    - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic trade.submitted
      --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic trade.completed --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic trade.deadletter --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic trade.completed.deadletter --partitions 1 --replication-factor 1
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/trade
      DATABASE_USERNAME: trade
      DATABASE_PASSWORD: trade
      KAFKA_BROKERS: kafka:9092
      DEMO_TOKEN: ${DEMO_TOKEN:?Set DEMO_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: api
    depends_on: &id001
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    image: abyss-trade-java-events-api
    ports:
    - 127.0.0.1:18080:8080
    mem_limit: 512m
  publisher:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/trade
      DATABASE_USERNAME: trade
      DATABASE_PASSWORD: trade
      KAFKA_BROKERS: kafka:9092
      DEMO_TOKEN: ${DEMO_TOKEN:?Set DEMO_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: publisher
    depends_on: *id001
    restart: unless-stopped
    image: abyss-trade-java-events-publisher
    mem_limit: 512m
  worker:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/trade
      DATABASE_USERNAME: trade
      DATABASE_PASSWORD: trade
      KAFKA_BROKERS: kafka:9092
      DEMO_TOKEN: ${DEMO_TOKEN:?Set DEMO_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: worker
    depends_on: *id001
    restart: unless-stopped
    image: abyss-trade-java-events-worker
    mem_limit: 512m
  portal:
    build: ./web
    ports:
    - 127.0.0.1:13000:80
    depends_on:
    - api
  docs:
    image: swaggerapi/swagger-ui:v5.29.0
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
    - ./openapi.yaml:/spec/openapi.yaml:ro
    ports:
    - 127.0.0.1:18081:8080
volumes:
  pgdata: null
  kafkadata: null
